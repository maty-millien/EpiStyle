name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (v + package.json version)
        required: true
        type: string
      sha:
        description: Commit to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - uses: actions/setup-node@v7
        with:
          node-version: "latest"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          expected="v$(jq -r .version package.json)"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Tag $TAG does not match package.json version $expected"
            exit 1
          fi
        env:
          TAG: ${{ inputs.tag }}

      - name: Package VSIX
        run: bun run package --out "epistyle-$TAG.vsix"
        env:
          TAG: ${{ inputs.tag }}

      - name: Publish to VS Code Marketplace
        run: bunx vsce publish --packagePath "epistyle-$TAG.vsix" --no-dependencies
        env:
          TAG: ${{ inputs.tag }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create GitHub release
        run: gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes "epistyle-$TAG.vsix"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
